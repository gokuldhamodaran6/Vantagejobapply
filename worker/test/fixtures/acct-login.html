<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Initech Jobs</title></head><body>
<h2>Welcome back</h2><p>Sign in to continue your application.</p>
<form onsubmit="event.preventDefault(); if (document.getElementById('pw').value === localStorage.pw) { sessionStorage.session = '1'; location.href = '/fx/acct-form.html'; } else document.getElementById('err').textContent = 'Incorrect password';">
<label for="em">Email</label><input id="em" type="email" required>
<label for="pw">Password</label><input id="pw" type="password" required>
<button type="submit">Sign in</button><p id="err" style="color:red"></p></form>
<script>document.getElementById('em').value = localStorage.email || '';</script></body></html>
