<!doctype html><html><head><meta charset="utf-8"><title>Verify · Initech</title></head><body>
<!-- Like Amazon A to Z: passwordless sign-in, the code box lives in a CLOSED shadow root the agent can't read. -->
<otp-box></otp-box>
<script>
customElements.define('otp-box', class extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({ mode: 'closed' });
    r.innerHTML = `<p>Enter the code we emailed you</p><input id="c" autocomplete="one-time-code" autofocus><p id="err"></p>`;
    setTimeout(() => r.getElementById('c').focus(), 50);
    window.__otp = () => r.getElementById('c').value;
  }
});
</script>
<button onclick="if (window.__otp() === '730514') { sessionStorage.session = '1'; location.href = '/fx/acct-form.html'; } else document.title = 'wrong ' + window.__otp();">Verify</button>
</body></html>
