<!doctype html><html><body><div id="root"></div>
<script>
const root=document.getElementById('root'); let state={step:'job', email:'', pw:''};
function btn(text, fn, auto){ const b=document.createElement('button'); b.textContent=text; if(auto) b.setAttribute('data-automation-id', auto); b.onclick=fn; return b; }
function field(label, id, type){ const d=document.createElement('div'); d.innerHTML=`<label for="${id}">${label}</label><input id="${id}" data-automation-id="${id}" type="${type||'text'}" ${label.includes('*')?'aria-required="true"':''}>`; return d; }
function render(){ root.innerHTML='';
 if(state.step==='job'){ root.innerHTML='<h1>Brand Marketing Specialist</h1><p>Chicago, IL</p>'; root.appendChild(btn('Apply', ()=>{state.step='how';render();}, 'adventureButton')); }
 else if(state.step==='how'){ root.innerHTML='<h2>Start Your Application</h2>'; root.appendChild(btn('Autofill with Resume',()=>{})); root.appendChild(btn('Apply Manually', ()=>{state.step='signin';render();}, 'applyManually')); }
 else if(state.step==='signin'){ root.innerHTML='<h2>Sign In</h2>'; root.appendChild(field('Email Address','email','email')); root.appendChild(field('Password','password','password'));
   root.appendChild(btn('Sign In', ()=>{ alert('no account'); }, 'signInSubmitButton')); const a=document.createElement('a'); a.href='#'; a.textContent='Create Account'; a.onclick=(e)=>{e.preventDefault(); state.step='create'; render();}; root.appendChild(a); }
 else if(state.step==='create'){ root.innerHTML='<h2>Create Account</h2>'; root.appendChild(field('Email Address*','email','email')); root.appendChild(field('Password*','password','password')); root.appendChild(field('Verify New Password*','verifyPassword','password'));
   const c=document.createElement('label'); c.innerHTML='<input type="checkbox" id="agree" data-automation-id="createAccountCheckbox"> Yes, I have read and consent to the terms and conditions'; root.appendChild(c);
   root.appendChild(btn('Create Account', ()=>{ const e=document.getElementById('email').value, p=document.getElementById('password').value, v=document.getElementById('verifyPassword').value; if(!e||!p||p!==v||!document.getElementById('agree').checked||!/[A-Z]/.test(p)||!/[0-9]/.test(p)){ showErr('Account details invalid'); return;} state.email=e; state.pw=p; state.step='verify'; render(); }, 'createAccountSubmitButton')); }
 else if(state.step==='verify'){ root.innerHTML='<h2>Verify your email</h2><p>We sent a verification code to '+state.email+'. Enter the code below.</p>'; root.appendChild(field('Verification Code','code','text')); root.appendChild(btn('Verify', ()=>{ if(document.getElementById('code').value==='482913'){ state.step='info'; render(); } else showErr('Wrong code'); })); }
 else if(state.step==='info'){ root.innerHTML='<h2>My Information</h2>';
   const how=document.createElement('div'); how.innerHTML='<label id="hl">How Did You Hear About Us?*</label><button aria-haspopup="listbox" aria-labelledby="hl" id="howbtn">Select One</button><ul role="listbox" id="howlist" style="display:none"><li role="option">Company Website</li><li role="option">LinkedIn</li><li role="option">Referral</li></ul>'; root.appendChild(how);
   setTimeout(()=>{ document.getElementById('howbtn').onclick=()=>{document.getElementById('howlist').style.display='block'}; [...document.querySelectorAll('#howlist li')].forEach(li=>li.onclick=()=>{document.getElementById('howbtn').textContent=li.textContent; document.getElementById('howlist').style.display='none';}); });
   root.appendChild(field('First Name*','legalNameSection_firstName')); root.appendChild(field('Last Name*','legalNameSection_lastName')); root.appendChild(field('Address Line 1*','addressSection_addressLine1')); root.appendChild(field('City*','addressSection_city')); root.appendChild(field('Postal Code*','addressSection_postalCode')); root.appendChild(field('Phone Number*','phone-number','tel'));
   root.appendChild(btn('Save and Continue', ()=>{ const need=['legalNameSection_firstName','addressSection_city','phone-number']; if(need.some(id=>!document.getElementById(id).value) || document.getElementById('howbtn').textContent==='Select One'){ showErr('Errors found: required fields'); return;} state.info={how:document.getElementById('howbtn').textContent, city: document.getElementById('addressSection_city').value}; state.step='exp'; render(); }, 'pageFooterNextButton')); }
 else if(state.step==='exp'){ root.innerHTML='<h2>My Experience</h2><label for="up">Upload resume *</label><input type="file" id="up" data-automation-id="file-upload-input-ref">'; root.appendChild(btn('Save and Continue', ()=>{ if(!document.getElementById('up').files.length){showErr('Resume required');return;} state.file=document.getElementById('up').files[0].name; state.step='q'; render(); }, 'pageFooterNextButton')); }
 else if(state.step==='q'){ root.innerHTML='<h2>Application Questions</h2><fieldset><legend>Have you previously been employed by Globex? *</legend><label><input type="radio" name="prev" value="Yes" id="p1">Yes</label><label><input type="radio" name="prev" value="No" id="p2">No</label></fieldset>';
   root.appendChild(btn('Save and Continue', ()=>{ const v=document.querySelector('input[name=prev]:checked'); if(!v){showErr('Answer required');return;} state.prev=v.value; state.step='review'; render(); }, 'pageFooterNextButton')); }
 else if(state.step==='review'){ root.innerHTML='<h2>Review</h2><p>'+JSON.stringify(state.info)+' file='+state.file+' prev='+state.prev+'</p>'; root.appendChild(btn('Submit', ()=>{ state.step='done'; render(); }, 'pageFooterSubmitButton')); }
 else if(state.step==='done'){ root.innerHTML='<h2>Application Submitted</h2><p>Thank you for applying. Account '+state.email+'. how='+state.info.how+' prev='+state.prev+' file='+state.file+'</p>'; }
}
function showErr(t){ const d=document.createElement('div'); d.setAttribute('data-automation-id','errorMessage'); d.textContent=t; root.appendChild(d); }
render();
</script></body></html>
